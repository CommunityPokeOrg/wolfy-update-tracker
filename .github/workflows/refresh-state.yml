name: Refresh tracker state

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read

# Serialize with every other job that commits data/*.json to main
# (same group name as record-sighting.yml) so two near-simultaneous
# issue/comment events can't race on the generated snapshot files.
concurrency:
  group: tracker-data-writes
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build state.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/build_state.py
      - name: Commit state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "wolfy-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/state.json data/stats.json data/sightings.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "state: refresh tracker snapshot"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase; then
              git push && exit 0
            else
              # data/*.json are generated: never hand-merge a rebase conflict.
              # Drop our commit, take upstream, rebuild the snapshot on top.
              git rebase --abort || true
              git reset --hard origin/main
              python3 tools/build_state.py
              git add data/state.json data/stats.json data/sightings.json
              if git diff --cached --quiet; then
                echo "upstream already carries this state"
                exit 0
              fi
              git commit -m "state: refresh tracker snapshot"
            fi
          done
          echo "could not push snapshot after 5 attempts"
          exit 1
